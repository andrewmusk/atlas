services:
  - type: web
    name: atlas
    env: docker
    region: oregon
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: atlas-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false

databases:
  - name: atlas-db
    plan: starter
    region: oregon
    databaseName: atlas
    user: atlas
